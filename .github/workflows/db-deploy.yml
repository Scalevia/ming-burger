# Applies committed migrations to a hosted Supabase project. Manual only.
# Each target is a GitHub Environment ("dev", "production") holding its own secrets:
#   SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_REF
# The "production" environment must require reviewer approval (repo settings).
name: Deploy database

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, production]
        required: true
      dry_run:
        description: Only show which migrations would be applied
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: db-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
      - name: Pending migrations
        run: pnpm exec supabase db push --dry-run
      - name: Apply migrations
        if: ${{ !inputs.dry_run }}
        run: pnpm exec supabase db push
