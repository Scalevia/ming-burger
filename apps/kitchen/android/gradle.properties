# 4 GB is enough for these apps and leaves room on 8 GB dev machines running Docker.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin incremental caches break when the project and the pub cache are on different
# Windows drives (e.g. D:\ vs C:\). Full compilation is fast for these small apps.
kotlin.incremental=false
